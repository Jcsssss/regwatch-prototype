<title>RegWatch - NIS 2 Transposition Tracker</title>
<style>
/* ================= Wavestone design tokens =================
   Charte: Background 2 / titles #451DC7 · Accent 1 #04F06A · Accent 2 #CAFEE0
   Accent 3 #250F6B · functional: #4682B4 (infographic), #FFCA4A / #FF2A49 (status)
   Maturity ramp + chart pair validated (CVD/contrast) light & dark. */
:root{
  --bg:#f5f4fa; --surface:#ffffff; --surface2:#f0eef8; --surface3:#e7e4f3;
  --ink:#16122e; --ink2:#413b60; --muted:#6f6b8c; --line:#e4e1f0; --line2:#cfcae1;
  --accent:#451DC7; --accent2:#250F6B; --accent-soft:#ece7fb; --accent-ink:#ffffff;
  --green:#04F06A; --green-soft:#CAFEE0;
  --m1:#b3a0f4; --m2:#3d1fd1; --m3:#04F06A; --m4:#00a551; --untracked:#d4d2e0;
  --map-stroke:#f5f4fa; --map-hover:#16122e;
  --ok:#0b6e3d; --warn:#7a5400; --bad:#d5163b;
  --st-ok-bg:#CAFEE0; --st-ok-ink:#0d5c33;
  --st-warn-bg:#FFCA4A; --st-warn-ink:#4a3300;
  --st-bad-bg:#FF2A49; --st-bad-ink:#ffffff;
  --info:#2f5e8f; --info-bg:#e4edf7;
  --ee:#5230d2; --ie:#3b82c4;
  --shadow:0 1px 2px rgba(37,15,107,.05),0 4px 16px rgba(37,15,107,.07);
  --font-ui:"Aptos","Segoe UI Variable Text","Segoe UI","SF Pro Text",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --font-mono:"Aptos Mono","SF Mono","Cascadia Code",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#131024; --surface:#1a1633; --surface2:#221d40; --surface3:#2b254e;
    --ink:#eceaf7; --ink2:#c2bedd; --muted:#8d89ad; --line:#2e2850; --line2:#3e3766;
    --accent:#a495f5; --accent2:#cbbaff; --accent-soft:#2d2361; --accent-ink:#17102f;
    --green:#04F06A; --green-soft:#143a28;
    --m1:#9c8ae0; --m2:#6b4ae8; --m3:#04F06A; --m4:#12b862; --untracked:#322c52;
    --map-stroke:#131024; --map-hover:#eceaf7;
    --ok:#37e388; --warn:#f0c05a; --bad:#ff7a8f;
    --st-ok-bg:#143a28; --st-ok-ink:#37e388;
    --st-warn-bg:#3d3213; --st-warn-ink:#f0c05a;
    --st-bad-bg:#471a26; --st-bad-ink:#ff8296;
    --info:#8fb9e4; --info-bg:#1d2a44;
    --ee:#8a76ec; --ie:#3f8bd1;
    --shadow:0 1px 2px rgba(0,0,0,.32),0 4px 18px rgba(0,0,0,.38);
  }
}
:root[data-theme="light"]{
  --bg:#f5f4fa; --surface:#ffffff; --surface2:#f0eef8; --surface3:#e7e4f3;
  --ink:#16122e; --ink2:#413b60; --muted:#6f6b8c; --line:#e4e1f0; --line2:#cfcae1;
  --accent:#451DC7; --accent2:#250F6B; --accent-soft:#ece7fb; --accent-ink:#ffffff;
  --green:#04F06A; --green-soft:#CAFEE0;
  --m1:#b3a0f4; --m2:#3d1fd1; --m3:#04F06A; --m4:#00a551; --untracked:#d4d2e0;
  --map-stroke:#f5f4fa; --map-hover:#16122e;
  --ok:#0b6e3d; --warn:#7a5400; --bad:#d5163b;
  --st-ok-bg:#CAFEE0; --st-ok-ink:#0d5c33;
  --st-warn-bg:#FFCA4A; --st-warn-ink:#4a3300;
  --st-bad-bg:#FF2A49; --st-bad-ink:#ffffff;
  --info:#2f5e8f; --info-bg:#e4edf7;
  --ee:#5230d2; --ie:#3b82c4;
  --shadow:0 1px 2px rgba(37,15,107,.05),0 4px 16px rgba(37,15,107,.07);
}
:root[data-theme="dark"]{
  --bg:#131024; --surface:#1a1633; --surface2:#221d40; --surface3:#2b254e;
  --ink:#eceaf7; --ink2:#c2bedd; --muted:#8d89ad; --line:#2e2850; --line2:#3e3766;
  --accent:#a495f5; --accent2:#cbbaff; --accent-soft:#2d2361; --accent-ink:#17102f;
  --green:#04F06A; --green-soft:#143a28;
  --m1:#9c8ae0; --m2:#6b4ae8; --m3:#04F06A; --m4:#12b862; --untracked:#322c52;
  --map-stroke:#131024; --map-hover:#eceaf7;
  --ok:#37e388; --warn:#f0c05a; --bad:#ff7a8f;
  --st-ok-bg:#143a28; --st-ok-ink:#37e388;
  --st-warn-bg:#3d3213; --st-warn-ink:#f0c05a;
  --st-bad-bg:#471a26; --st-bad-ink:#ff8296;
  --info:#8fb9e4; --info-bg:#1d2a44;
  --ee:#8a76ec; --ie:#3f8bd1;
  --shadow:0 1px 2px rgba(0,0,0,.32),0 4px 18px rgba(0,0,0,.38);
}

/* ================= Base ================= */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:.92em}
.lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ================= Header ================= */
header.app{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
header.app::before{content:"";display:block;height:3px;background:linear-gradient(90deg,#451DC7 0%,#250F6B 58%,#04F06A 100%)}
.hd-row{max-width:1240px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:6px;text-decoration:none;border-radius:6px}
.brand:hover{text-decoration:none}
.brand:hover .logo{opacity:.78}
.brand .logo{font-weight:750;font-size:19px;letter-spacing:-.01em;color:var(--ink);white-space:nowrap}
.brand .logo b{color:var(--accent);font-weight:750}
.brand .by{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.02em;white-space:nowrap}
.brand .proto{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--st-warn-ink);background:var(--st-warn-bg);border-radius:4px;padding:2px 7px;white-space:nowrap}
.reg-pills{display:flex;gap:6px;align-items:center}
.reg-pill{border:1px solid var(--line2);background:var(--surface);color:var(--ink2);border-radius:999px;padding:4px 13px;font-size:12.5px;font-weight:600;cursor:pointer}
.reg-pill.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.reg-pill.soon{opacity:.45;cursor:not-allowed}
.hd-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.role-wrap{display:flex;align-items:center;gap:7px}
.role-wrap select{background:var(--surface2);color:var(--ink);border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;font-weight:600;cursor:pointer}
/* La roue crantee, a cote du role : elle deplie l'onglet Diagnostic. Discrete
   au repos, elle prend la couleur d'accent une fois enfoncee - c'est le seul
   indice que l'onglet vient de la, si on l'a ouvert et oublie. */
.gear-btn{border:1px solid var(--line2);background:var(--surface2);color:var(--muted);border-radius:7px;padding:4px 8px;font-size:14px;line-height:1;cursor:pointer}
.gear-btn:hover{color:var(--ink)}
.gear-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav.tabs{max-width:1240px;margin:0 auto;padding:0 24px;display:flex;gap:2px;overflow-x:auto}
nav.tabs a{color:var(--ink2);font-weight:600;font-size:13.5px;padding:9px 13px;border-bottom:2.5px solid transparent;white-space:nowrap}
nav.tabs a:hover{text-decoration:none;color:var(--ink)}
nav.tabs a.on{color:var(--accent);border-bottom-color:var(--accent)}
nav.tabs .badge{display:inline-block;min-width:17px;text-align:center;background:var(--st-warn-bg);color:var(--st-warn-ink);border-radius:999px;font-size:11px;font-weight:700;padding:1px 5px;margin-left:5px}
nav.tabs .badge[hidden]{display:none}


/* ================= Fiche pays refondue (app_fiche.js) =================
   Elle epouse la structure du classeur : une section par feuille. Les styles
   sont prefixes f- pour ne pas entrer en collision avec la fiche d'origine,
   qui sert encore REC. */
.fhead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;padding:2px 0 18px}
.fflag{width:87px;height:58px;border-radius:7px;overflow:hidden;flex:none;margin-top:7px;
  box-shadow:0 0 0 1px var(--line2);display:block}
.fflag svg,.fflag img{width:100%;height:100%;object-fit:cover;display:block}
.fhead h1{font-size:29px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0}
/* Le bloc de titre occupe toute la largeur restante, sinon la rangee de
   pastilles se dimensionne sur son contenu et le bouton pousse a droite se
   colle aux pastilles au lieu de rejoindre le bord de la fiche. */
.fhead-txt{flex:1;min-width:0}
.fpills{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:8px}
/* La generation des slides est une action, pas un etat : elle partage la ligne
   des pastilles mais se tient a l'autre bout. */
.fdeck{margin-left:auto}
@media (max-width:720px){.fdeck{margin-left:0}}
.fpill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;
  font-size:12px;font-weight:700}
.fpill svg{width:12px;height:12px;color:var(--muted)}
.fpill.ok{background:var(--st-ok-bg);color:var(--st-ok-ink)}
.fpill.no{background:var(--st-bad-bg);color:var(--st-bad-ink)}
.fpill.wip{background:var(--st-warn-bg);color:var(--st-warn-ink)}
.fpill.upd{background:var(--surface3);color:var(--ink2);font-weight:600}
.fcellsw{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);
  cursor:pointer;user-select:none;margin-left:4px}
.fcellsw input{margin:0;cursor:pointer}

/* --- les cinq bulles --- */
.ffacts{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin-bottom:20px}
.ffact{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px 12px;display:flex;flex-direction:column;gap:7px;min-width:0}
.ffact .ic{width:26px;height:26px;border-radius:7px;background:var(--accent-soft);
  color:var(--accent);display:grid;place-items:center;flex:none}
.ffact .ic svg{width:15px;height:15px}
.ffact .lbl{font-size:10.5px;font-weight:800;letter-spacing:.075em;text-transform:uppercase;
  color:var(--muted)}
.ffact .val{font-size:15px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.ffact .val.sm{font-size:12.5px;font-weight:600;line-height:1.4;max-height:5.6em;overflow-y:auto}
.fmat{display:flex;align-items:center;gap:9px}
.fmat b{font-size:19px;font-weight:800;color:var(--mc);font-variant-numeric:tabular-nums}
.fmat .dots{display:flex;gap:3px}
.fmat .dots i{width:15px;height:6px;border-radius:2px;background:var(--line2)}
.fmat .dots i.on{background:var(--mc)}

/* --- grille et navigation --- */
.fcols{display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:20px;align-items:start}
/* --fhdr est la hauteur mesuree de header.app, posee par ficheHeader(). La
   barre d'ancres se collait a top:0, c'est-a-dire exactement la ou l'en-tete de
   l'application est deja colle, et avec un z-index inferieur : elle passait
   dessous et disparaissait. La hauteur de l'en-tete change avec la largeur de
   l'ecran, donc elle se mesure et ne se devine pas. */
.fnav{position:sticky;top:var(--fhdr,96px);z-index:35;background:var(--bg);padding:6px 0 10px}
.fnav-in{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);
  border-radius:11px;padding:4px;overflow-x:auto}
.fnav-in button{border:0;background:transparent;border-radius:8px;cursor:pointer;
  padding:8px 13px;font-size:13px;font-weight:700;color:var(--ink2);
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.fnav-in button svg{width:15px;height:15px;flex:none}
.fnav-in button:hover{background:var(--surface2);color:var(--ink)}
.fnav-in button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
/* Le retour et le nom du pays, replies tant que l'en-tete de la fiche est
   visible : ils n'apparaissent que lorsqu'il sort de l'ecran, faute de quoi ils
   repeteraient le titre a dix pixels de distance. */
.fnav-back,.fnav-id,.fnav-sep{display:none}
.fnav.stuck .fnav-back{display:grid;place-items:center;width:30px;height:30px;flex:none;
  border-radius:8px;color:var(--ink2);text-decoration:none}
.fnav.stuck .fnav-back:hover{background:var(--surface2);color:var(--ink);text-decoration:none}
.fnav-back svg{width:16px;height:16px}
.fnav.stuck .fnav-id{display:flex;align-items:center;gap:8px;flex:none;
  padding:0 2px;min-width:0;max-width:190px}
.fnav-flag{width:21px;height:14px;border-radius:3px;overflow:hidden;flex:none;
  box-shadow:0 0 0 1px var(--line2);display:block}
.fnav-flag svg{width:100%;height:100%;display:block}
.fnav-id b{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.fnav.stuck .fnav-sep{display:block;width:1px;height:22px;flex:none;
  background:var(--line2);margin:0 4px}
@media (max-width:720px){
  .fnav.stuck .fnav-id{max-width:104px}
}

/* --- sections --- */
.fsec{background:var(--surface);border:1px solid var(--line);border-radius:13px;
  margin-bottom:16px;overflow:hidden;
  scroll-margin-top:calc(var(--fhdr,96px) + var(--fnavh,52px) + 8px)}
.fsec-h{display:flex;align-items:center;gap:11px;padding:15px 17px;border-bottom:1px solid var(--line)}
.fsec-h .ic{width:31px;height:31px;border-radius:9px;display:grid;place-items:center;flex:none;
  background:var(--accent-soft);color:var(--accent)}
.fsec-h .ic svg{width:17px;height:17px}
.fsec-h h2{font-size:16.5px;font-weight:800;margin:0}
.fsec-h .cnt{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:600;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.fsec-b{padding:15px 17px 17px}

/* --- paires libelle / valeur --- */
.frows{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:10px;overflow:hidden;margin:0}
.frow{display:grid;grid-template-columns:minmax(150px,36%) 1fr;gap:14px;
  background:var(--surface);padding:10px 13px;align-items:start}
.frow dt{font-size:12.5px;color:var(--ink2);font-weight:600;display:flex;align-items:center;
  gap:7px;flex-wrap:wrap;margin:0}
.frow dd{margin:0;font-size:13.5px;font-weight:600;overflow-wrap:anywhere}
.fv-none,.fv-nc{color:var(--muted);font-weight:500;font-style:italic}
.fcell{font-family:var(--font-mono);font-size:10px;font-weight:600;color:var(--accent);
  background:var(--accent-soft);border-radius:4px;padding:1px 5px;white-space:nowrap;display:none}
body.fcells .fcell{display:inline}
.ftag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;
  font-size:11.5px;font-weight:800}
.ftag.y{background:var(--st-ok-bg);color:var(--st-ok-ink)}
.ftag.n{background:var(--st-bad-bg);color:var(--st-bad-ink)}

/* --- blocs visuels --- */
.fblock{margin-top:18px}
.flab{font-size:11px;font-weight:800;letter-spacing:.075em;text-transform:uppercase;
  color:var(--muted);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.fnote{font-size:11.5px;color:var(--muted);margin-top:9px;line-height:1.5}
.fcks{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:7px}
.fck{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;
  background:var(--surface2);border-radius:8px;padding:8px 11px}
.fck svg{width:13px;height:13px;flex:none}
.fck.on{background:var(--st-ok-bg);color:var(--st-ok-ink)}
.fck.off{color:var(--muted);font-weight:500}
.fck.other{background:var(--info-bg);color:var(--info)}
.fbars{display:grid;gap:12px}
.fbar{display:grid;grid-template-columns:130px 1fr auto;gap:12px;align-items:center}
.fbar .k{font-size:12.5px;font-weight:700;color:var(--ink2)}
.fbar .t{height:22px;background:var(--surface2);border-radius:6px;overflow:hidden}
.fbar .t i{display:block;height:100%;border-radius:6px}
.fbar .v{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;min-width:34px;
  text-align:right}
.fbar .v.na{font-size:12px;font-weight:600;color:var(--muted)}
.ftl{position:relative;padding:20px 0 4px}
.ftl .axis{position:absolute;left:0;right:0;top:28px;height:3px;background:var(--line2);border-radius:2px}
.ftl .stops{position:relative;display:flex;justify-content:space-between;gap:8px}
.ftl .stop{text-align:center;flex:1;min-width:0}
.ftl .dot{width:15px;height:15px;border-radius:50%;background:var(--accent);margin:0 auto 9px;
  box-shadow:0 0 0 4px var(--bg)}
.ftl .h{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.ftl .d{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.35}

/* --- voir plus --- */
.fmore{margin-top:14px;border-top:1px dashed var(--line2);padding-top:12px}
.fmore-t{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:9px;
  font-size:12.5px;font-weight:700;color:var(--ink2);cursor:pointer;font-family:inherit}
.fmore-t:hover{background:var(--surface3);color:var(--ink)}
.fmore-t svg{width:13px;height:13px;transition:transform .18s}
.fmore-t[aria-expanded="true"] svg{transform:rotate(180deg)}
.finner{margin-top:11px}

/* --- recommandation --- */
.freco{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--surface)}
/* accent + accent-ink, pas accent2 : en theme sombre accent2 est un violet
   clair, sur lequel du texte blanc ne se lit pas. */
.freco-h{display:flex;align-items:center;gap:11px;padding:15px 17px;
  background:var(--accent);color:var(--accent-ink)}
.freco-h svg{width:18px;height:18px;color:var(--accent-ink);opacity:.75}
.freco-h h2{font-size:16px;font-weight:800;margin:0}
.freco-h .by{margin-left:auto;font-size:10.5px;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;color:var(--accent-ink);opacity:.6}
.freco-b{padding:16px 17px}
.freco-b .none{background:var(--surface2);border:1px dashed var(--line2);border-radius:10px;
  padding:13px 15px;font-size:13px;color:var(--ink2);line-height:1.55}

/* --- colonne de droite --- */
.fasidew{position:sticky;top:calc(var(--fhdr,96px) + 8px);align-self:start}
/* 96 px de reserve en bas : sans elle, la baleine se posait sur le bouton
   « Secteurs, documents, sources » de la colonne. */
.faside{display:grid;gap:14px;max-height:calc(100vh - var(--fhdr,96px) - 96px);
  overflow-y:auto;padding-right:3px;
  scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.faside::-webkit-scrollbar{width:7px}
.faside::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px}
/* Les deux bords de la colonne se signalent : un degrade montre que le contenu
   se poursuit, le bouton nomme ce qui s'y trouve et fait defiler. Chacun
   disparait quand son bord est atteint, et les deux quand la colonne tient
   entiere dans l'ecran. */
.ffade{position:absolute;left:0;right:3px;height:72px;pointer-events:none;
  transition:opacity .22s;z-index:1}
.ffade.down{bottom:0;background:linear-gradient(to bottom,transparent,var(--bg) 80%)}
.ffade.up{top:0;height:56px;background:linear-gradient(to top,transparent,var(--bg) 80%)}
.fhint{position:absolute;left:50%;transform:translateX(-50%);display:inline-flex;
  align-items:center;gap:7px;background:var(--accent);color:var(--accent-ink);border:0;
  border-radius:999px;padding:6px 14px;font-size:11.5px;font-weight:700;cursor:pointer;
  white-space:nowrap;font-family:inherit;transition:opacity .22s;box-shadow:var(--shadow);
  z-index:2}
.fhint.down{bottom:9px}
.fhint.up{top:9px}
.fhint svg{width:13px;height:13px}
.fasidew.at-end .ffade.down,.fasidew.at-end .fhint.down{opacity:0;pointer-events:none}
.fasidew.at-start .ffade.up,.fasidew.at-start .fhint.up{opacity:0;pointer-events:none}
.ftl-list{list-style:none;margin:0;padding:0;display:grid;gap:13px}
.ftl-list li{display:grid;grid-template-columns:74px 1fr;gap:11px;font-size:12.5px}
.ftl-list .when{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700;
  font-size:11.5px;text-align:right;line-height:1.35}
.ftl-list .what{border-left:2px solid var(--line2);padding-left:11px}
.ftl-list li:first-child .what{border-color:var(--accent)}
.fbtn{display:flex;align-items:center;justify-content:space-between;gap:9px;width:100%;
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:9px;padding:11px 14px;
  font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;font-family:inherit}
.fbtn:hover{filter:brightness(1.12);text-decoration:none}
.fbtn svg{width:15px;height:15px;flex:none}
.fbtn.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line2)}
.fbtn.ghost:hover{background:var(--surface3);color:var(--ink)}

/* --- fenetre des secteurs --- */
#ficheSectors{border:0;padding:0;background:transparent;max-width:min(920px,94vw);width:100%}
#ficheSectors::backdrop{background:rgba(10,8,20,.62)}
.fmodal{background:var(--surface);border:1px solid var(--line2);border-radius:16px;overflow:hidden}
.fmodal-h{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.fmodal-h h2{font-size:17px;font-weight:800;margin:0}
.fmodal-h .x{margin-left:auto;background:var(--surface2);border:1px solid var(--line2);
  border-radius:8px;width:30px;height:30px;display:grid;place-items:center;cursor:pointer;
  color:var(--ink)}
.fmodal-h .x svg{width:14px;height:14px}
.fmodal-b{padding:18px 20px 22px;max-height:min(74vh,660px);overflow-y:auto}
.fann{font-size:11px;font-weight:800;letter-spacing:.085em;text-transform:uppercase;
  color:var(--muted);display:flex;align-items:center;gap:9px;margin:4px 0 11px}
.fann:not(:first-child){margin-top:22px}
.fann::after{content:"";flex:1;height:1px;background:var(--line)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:9px}
.fs{border:1px solid var(--line);border-radius:11px;padding:12px;display:flex;
  flex-direction:column;gap:8px;background:var(--surface2)}
.fs .si{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
  background:var(--surface);color:var(--muted)}
.fs .si svg{width:15px;height:15px}
.fs .sn{font-size:12.5px;font-weight:700;line-height:1.3}
.fs .sd{font-size:11px;color:var(--muted);line-height:1.35}
.fs.ee{background:var(--accent-soft);border-color:transparent}
.fs.ee .si{background:var(--accent);color:var(--accent-ink)}
.fs.ei .si{color:var(--ie)}
.fmlg{font-size:11.5px;color:var(--muted);margin-top:16px;padding-top:13px;
  border-top:1px solid var(--line);line-height:1.5}

@media (max-width:1080px){.ffacts{grid-template-columns:repeat(2,1fr)}}
@media (max-width:980px){
  .fcols{grid-template-columns:1fr}
  .fasidew{position:static}
  .faside{max-height:none;overflow:visible}
  .ffade,.fhint{display:none}   /* la page defile normalement : rien a signaler */
}
@media (max-width:620px){
  .ffacts{grid-template-columns:1fr}
  .frow{grid-template-columns:1fr;gap:3px}
  .fbar{grid-template-columns:1fr auto;gap:8px}
  .fbar .t{grid-column:1/-1}
}


/* --- dialogue de generation du rapport (app_report.js) --- */
#rptDlg{border:0;padding:0;background:transparent;max-width:min(470px,94vw);width:100%}
#rptDlg::backdrop{background:rgba(10,8,20,.62)}
.rpt-box{background:var(--surface);border:1px solid var(--line2);border-radius:14px;overflow:hidden}
.rpt-h{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line)}
.rpt-h h2{font-size:15.5px;font-weight:800;margin:0}
.rpt-h .x{margin-left:auto;background:var(--surface2);border:1px solid var(--line2);
  border-radius:8px;width:30px;height:30px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.rpt-h .x svg{width:14px;height:14px}
.rpt-b{padding:16px 18px;display:grid;gap:16px}
.rpt-lab{font-size:10.5px;font-weight:800;letter-spacing:.075em;text-transform:uppercase;
  color:var(--muted);display:block;margin-bottom:7px}
.rpt-opts{display:flex;gap:7px;flex-wrap:wrap}
.rpt-opt{border:1px solid var(--line2);background:transparent;border-radius:8px;padding:7px 13px;
  font-size:12.5px;font-weight:700;color:var(--ink2);cursor:pointer;font-family:inherit}
.rpt-opt:hover{background:var(--surface2);color:var(--ink)}
.rpt-opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rpt-note{font-size:12px;color:var(--muted);line-height:1.5;background:var(--surface2);
  border-radius:9px;padding:11px 13px}
.rpt-f{display:flex;align-items:center;gap:12px;padding:13px 18px;border-top:1px solid var(--line)}
.rpt-msg{font-size:11.5px;color:var(--muted);flex:1;min-width:0;overflow-wrap:anywhere}

/* ================= Layout ================= */
main{max-width:1240px;margin:0 auto;padding:22px 24px 60px}
.view{display:none}
.view.on{display:block}
.grid-ov{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(280px,1fr);gap:18px;align-items:start}
@media(max-width:960px){.grid-ov{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
/* Spacing between stacked cards belongs here, not in inline styles: deleting
   a card used to silently remove the gap its neighbours relied on.
   Direct children only - cards inside .grid-ov / .cty-grid are spaced by gap. */
.view > .card + .card,.view > .card + .rolenote,.view > .rolenote + .card{margin-top:20px}
/* Anything at all between two cards used to swallow the gap - the rule above
   only matches immediate siblings of the same kind. This one doesn't care. */
.view > * + .card{margin-top:20px}

.card .cap{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:13px 16px 0 16px}
.card h2{font-size:15px;font-weight:700;margin:0;letter-spacing:-.005em;color:var(--accent)}
.card .bd{padding:12px 16px 16px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
@media(max-width:900px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;box-shadow:var(--shadow)}
.tile .v{font-size:26px;font-weight:750;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums;color:var(--accent2)}
.tile .v small{font-size:15px;color:var(--muted);font-weight:600}
.tile .s{font-size:12px;color:var(--muted);margin-top:2px}

/* ================= Map ================= */
.map-wrap{position:relative}
.map-wrap svg{width:100%;height:auto;display:block;border-radius:8px}
.ctry{cursor:pointer;transition:opacity .12s}
.map-legend{display:flex;flex-wrap:wrap;gap:7px 16px;margin-top:12px;align-items:center}
.leg-it{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);cursor:default}
.leg-sw{width:13px;height:13px;border-radius:3.5px;flex:none}
.leg-it .n{color:var(--muted);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line2);background:var(--surface);color:var(--ink2);border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{opacity:.92;color:var(--accent-ink)}
.btn.ok{background:#04F06A;border-color:#04F06A;color:#250F6B;font-weight:700}
.btn.ok:hover{opacity:.9;color:#250F6B}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.danger:hover{border-color:var(--bad);color:var(--bad);opacity:.85}

/* feed */
.feed{display:flex;flex-direction:column}
.feed-it{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}
.feed-it:last-child{border-bottom:none}
.feed-it .d{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);white-space:nowrap;padding-top:2px;font-variant-numeric:tabular-nums}
.feed-it .t{font-size:13px;color:var(--ink2)}
.feed-it .t .c{font-weight:700;color:var(--ink)}

/* ================= Chips & badges ================= */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2.5px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;flex:none}
.chip.lvl{color:#fff}
.chip.fw-final{background:var(--st-ok-bg);color:var(--st-ok-ink)}
.chip.fw-temporary{background:var(--st-warn-bg);color:var(--st-warn-ink)}
.chip.fw-none{background:var(--surface3);color:var(--muted)}
.chip.src-official{background:var(--st-ok-bg);color:var(--st-ok-ink)}
.chip.src-unofficial{background:var(--st-warn-bg);color:var(--st-warn-ink)}
.chip.src-manual{background:var(--info-bg);color:var(--info)}
.chip.st-pending{background:var(--st-warn-bg);color:var(--st-warn-ink)}
.chip.st-validated{background:var(--st-ok-bg);color:var(--st-ok-ink)}
.chip.st-rejected{background:var(--st-bad-bg);color:var(--st-bad-ink)}
.chip.eu{background:var(--accent-soft);color:var(--accent)}

/* level stepper */
.stepper{display:flex;gap:4px;align-items:center}
.stepper .st{width:26px;height:9px;border-radius:4px;background:var(--surface3)}
.stepper .st.on1{background:var(--m1)} .stepper .st.on2{background:var(--m2)} .stepper .st.on3{background:var(--m3)} .stepper .st.on4{background:var(--m4)}

/* ================= Tables ================= */
.tbl-wrap{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:650;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.rowlink{cursor:pointer}
.tbl tr.rowlink:hover td{background:var(--surface2)}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--font-mono);font-size:12px}
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:13px}
.filters input[type=search],.filters select{background:var(--surface);border:1px solid var(--line2);color:var(--ink);border-radius:8px;padding:7px 11px;font-size:13px;min-width:120px}
.filters input[type=search]{min-width:210px}

/* ================= Country page ================= */
.cty-head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.cty-head .flag{font-size:38px;line-height:1}
.cty-head h1{margin:0;font-size:25px;font-weight:750;letter-spacing:-.015em;color:var(--accent)}
.cty-head .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px;align-items:center}
.cty-head .upd{margin-left:auto;text-align:right;font-size:12px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:18px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.fact .k{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:650;margin-bottom:3px}
.fact .v{font-size:13px;color:var(--ink2)}
.fact .v b{color:var(--ink)}
.cty-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:18px;align-items:start}
@media(max-width:960px){.cty-grid{grid-template-columns:1fr}}
.sec{margin-bottom:16px}
.sec h3{font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent2);font-weight:700;margin:0 0 8px}
.sec ul{margin:0;padding-left:19px;color:var(--ink2)}
.sec li{margin-bottom:6px;max-width:72ch}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line2);border-radius:2px}
.tl li{position:relative;padding:0 0 13px 24px}
.tl li:last-child{padding-bottom:2px}
.tl .pt{position:absolute;left:0;top:5px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2.5px solid var(--surface)}
.tl li.added .pt{background:#04F06A}
.tl .d{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl .x{font-size:13.5px;color:var(--ink2)}
.auth{display:flex;flex-direction:column;gap:9px}
.auth .a b{display:block;font-size:13.5px;color:var(--ink)}
.auth .a span{font-size:12.5px;color:var(--muted)}
.srcs{display:flex;flex-direction:column;gap:8px}
.srcs .s{display:flex;align-items:center;gap:9px;font-size:13px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;font-weight:600;font-size:13px}

/* ================= Inbox ================= */
.q-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px}
.q-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.q-top .d{font-family:var(--font-mono);font-size:11.5px;color:var(--muted)}
.q-title{font-size:14.5px;font-weight:700;margin:2px 0 4px}
.q-sum{font-size:13px;color:var(--ink2);max-width:80ch}
.lang-switch{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:12px}
.lang-switch button{border:0;background:var(--surface);color:var(--muted);font:inherit;font-size:12px;font-weight:700;padding:5px 10px;cursor:pointer;letter-spacing:.03em}
.lang-switch button+button{border-left:1px solid var(--line)}
.lang-switch button.on{background:var(--accent);color:#fff}
.d-orig{margin-left:6px;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:999px;white-space:nowrap}
.d-flux{background:var(--st-ok-bg);color:var(--st-ok-ink)}
.d-page{background:var(--info-bg);color:var(--info)}
.d-ia{background:var(--st-warn-bg);color:var(--st-warn-ink)}
.d-inconnue{background:var(--surface3);color:var(--muted)}
/* One per line: the right-hand column is ~470px, and two columns there would
   squeeze the descriptions to two words a line. */
/* ================= KPI board ================= */
.kpi-wrap{overflow-x:auto;overflow-y:hidden;margin-top:4px;-webkit-overflow-scrolling:touch}
/* Wide content scrolls in its own container rather than shrinking: a viewBox
   scales the labels down with the bars, and 8px country names are not read.
   The floor itself is set per chart size, inline, by the renderer. */
.kpi-svg{width:100%;height:auto;display:block}
/* Recessive grid and axes: the data carries the ink, not the scaffolding. */
.kpi-grid{stroke:var(--line);stroke-width:1}
.kpi-axis{fill:var(--muted);font-size:10.5px;font-family:var(--font-mono)}
/* Text wears text tokens, never the series colour. */
.kpi-lbl{fill:var(--ink2);font-size:12px}
.kpi-val{fill:var(--ink);font-size:11.5px;font-weight:700;font-family:var(--font-mono)}
.kpi-seg{fill:#fff;font-size:11px;font-weight:700;text-anchor:middle;font-family:var(--font-mono)}
/* A legend for two or more series, always: identity is never colour alone. */
.kpi-legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:2px 0 8px;font-size:12.5px;color:var(--ink2)}
.kpi-leg{display:inline-flex;align-items:center;gap:6px}
.kpi-leg .sw{width:11px;height:11px;border-radius:3px;flex:none}

/* ---- the builder ---- */
/* The preview lives directly under the controls: the point of the card is that
   a change to a control is seen without moving. */
.kpi-builder{border-color:var(--line2)}
.kpi-build-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.kpi-build-help{margin:9px 0 0}
.kpi-chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.kpi-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);
  border:1px solid var(--line2);border-radius:999px;padding:4px 6px 4px 11px;
  font-size:12.5px;font-weight:600;color:var(--ink)}
.kpi-chip-x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:11px;
  line-height:1;padding:3px 4px;border-radius:999px;font-family:inherit}
.kpi-chip-x:hover{color:var(--bad);background:var(--surface3)}
.kpi-preview{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.kpi-h3{font-size:12.5px;font-weight:700;margin:0 0 2px;color:var(--ink)}
.kpi-meta{margin-top:0}

/* ---- crossing several indicators: rows down, indicators across ---- */
.kpi-mx{display:grid;gap:3px;min-width:min-content}
.kpi-mx-r{display:grid;grid-template-columns:150px repeat(var(--cols),minmax(88px,168px));gap:3px;align-items:stretch}
.kpi-mx-lbl{font-size:12px;color:var(--ink2);align-self:center;padding-right:6px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi-mx-h{font-size:11px;font-weight:700;color:var(--ink);line-height:1.25;padding:0 2px 4px;
  align-self:end;hyphens:auto}
.kpi-mx-c{display:flex;align-items:center;justify-content:center;min-height:28px;border-radius:5px;
  font-size:12px;font-weight:700;font-family:var(--font-mono);padding:3px 5px;text-align:center;
  line-height:1.2;overflow:hidden}
.kpi-mx-c.cat{color:#fff;font-family:inherit;font-size:11.5px;letter-spacing:-.01em}
.kpi-mx-c.empty{background:var(--surface3);color:var(--muted)}
.kpi-leg-t{font-weight:700;color:var(--ink);margin-right:2px}
.kpi-ramp{display:inline-flex;gap:2px;margin-right:5px}
.kpi-ramp i{width:13px;height:11px;border-radius:2px;display:block}

/* ---- donuts ---- */
.kpi-donuts{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start;padding:4px 0}
.kpi-donut{margin:0;text-align:center}
.kpi-donut figcaption{font-size:11.5px;color:var(--ink2);margin-top:2px;font-weight:600}
.kpi-hero{fill:var(--ink);font-size:21px;font-weight:750;font-family:var(--font-mono)}

/* ---- one square per country ---- */
.kpi-cells{display:flex;flex-wrap:wrap;gap:3px;padding:2px 0 4px}
.kpi-cell{width:var(--cell);height:var(--cell);border-radius:4px;display:inline-flex;
  align-items:center;justify-content:center;font-size:9.5px;font-weight:700;
  color:#fff;font-family:var(--font-mono);letter-spacing:-.02em}
.kpi-grid-h{font-size:11.5px;font-weight:700;color:var(--ink2);margin-top:8px}

/* ---- reliability, shown with its reasons ---- */
.rel{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.rel b{font-family:var(--font-mono);margin-left:2px}
.rel-hi{background:var(--st-ok-bg);color:var(--st-ok-ink)}
.rel-mid{background:var(--st-warn-bg);color:var(--st-warn-ink)}
.rel-lo{background:var(--surface3);color:var(--muted)}
.rel-pen{font-size:11.5px;color:var(--bad);margin-top:4px}

/* ---- proposed sources, awaiting a validator ---- */
/* Les propositions se lisent dans le tableau de l'onglet Sources ; il ne reste
   d'elles que le domaine, sous le nom de la source. */
.cand-u{font-size:11.5px;color:var(--muted);word-break:break-all;margin-top:2px}
.tbl .btn{padding:4px 9px;font-size:11.5px}

/* Le panneau "Pourquoi xx sur 100" : ses notes finissaient collées à l'extrait
   qui le suit, les deux blocs se lisant comme un seul. */
.rel-why[open]{margin-bottom:11px;padding-bottom:2px}
.rel-why[open] > summary{margin-bottom:2px}

/* Filtre par pays de l'onglet Sources : mêmes drapeaux que la file de veille. */
/* Quatre compteurs de volume, dans le diagnostic : des chiffres, pas des
   tuiles de tableau de bord - ils décrivent ce qui est chargé, rien de plus. */
.figs4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0}
.fig4{padding:0 16px;border-left:1px solid var(--line)}
.fig4:first-child{padding-left:0;border-left:0}
.fig4 .v{display:block;font-size:26px;font-weight:750;letter-spacing:-.02em;
  color:var(--accent2);font-variant-numeric:tabular-nums;line-height:1.1}
.fig4 .k{display:block;margin-top:3px;font-size:11.5px;color:var(--ink2)}
.sflags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 13px}
.sflag{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;
  border:1px solid var(--line2);border-radius:999px;background:var(--surface);
  color:var(--ink2);font:inherit;font-size:12px;cursor:pointer;line-height:1.2}
.sflag:hover{border-color:var(--accent);color:var(--ink)}
.sflag:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sflag.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sflag .fi{width:18px;height:13px;flex:0 0 auto;border-radius:2px}
.sflag-n{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.sflag.on .sflag-n{color:var(--accent-ink);opacity:.75}
.q-search{padding:6px 11px;border:1px solid var(--line2);border-radius:8px;
  background:var(--surface);color:var(--ink);font:inherit;font-size:13px;min-width:210px}
.q-search:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}

/* ---- cyber-theme coverage ---- */
.thms{display:flex;flex-direction:column;gap:7px}
.thm{display:grid;grid-template-columns:1fr 76px 46px;gap:9px;align-items:center;font-size:12.5px}
.thm-n{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thm-bar{height:7px;background:var(--surface3);border-radius:4px;overflow:hidden}
.thm-bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.thm-v{text-align:right;font-family:var(--font-mono);font-weight:700;color:var(--ink)}
.thm-v small{color:var(--muted);font-weight:600}

/* ---- a card that folds ----
   Twenty-nine rows of feed registry are reference material, not something to
   read on the way past. The card keeps its header - which carries the count, so
   the summary still says something when shut - and hides only the table. */
.q-orig{margin-top:7px}
.q-orig > summary{cursor:pointer;font-size:11.5px;color:var(--accent);list-style:none}
.q-orig > summary::-webkit-details-marker{display:none}
.q-orig > summary:hover{text-decoration:underline}
.q-orig > div{margin-top:6px;padding-left:9px;border-left:2px solid var(--line2);
  font-size:12px;color:var(--ink2);font-style:italic}
details.fold > summary{list-style:none;cursor:pointer;user-select:none}
details.fold > summary::-webkit-details-marker{display:none}
details.fold > summary:hover h2{text-decoration:underline}
details.fold > summary .fold-car{margin-left:auto;color:var(--ink2);font-size:13px;line-height:1;
  border:1px solid var(--line2);border-radius:7px;padding:4px 9px;
  transition:transform .15s ease;flex:none}
details.fold > summary:hover .fold-car{border-color:var(--accent);color:var(--accent)}
details.fold[open] > summary .fold-car{transform:rotate(180deg)}
details.fold:not([open]) > summary{padding-bottom:13px}

/* ================= The assistant ================= */
.chat-card .bd{padding-top:6px}
.chat-log{min-height:280px;max-height:min(62vh,720px);overflow-y:auto;padding:10px 2px 4px;
  display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.chat-m{display:flex}
.chat-m.user{justify-content:flex-end}
.chat-b{max-width:min(760px,92%);border-radius:12px;padding:10px 14px;font-size:13.5px;line-height:1.55}
.chat-m.user .chat-b{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.chat-m.bot .chat-b{background:var(--surface2);border:1px solid var(--line);color:var(--ink);
  border-bottom-left-radius:4px;max-width:100%;width:100%}
.chat-b.err{background:var(--st-bad-bg,var(--surface3));border-color:var(--bad);color:var(--ink)}
.chat-b p{margin:0 0 8px}
.chat-b p:last-child{margin-bottom:0}
.chat-b ul{margin:0 0 8px;padding-left:19px}
.chat-b li{margin-bottom:3px}
.chat-b code{font-family:var(--font-mono);font-size:12px;background:var(--surface3);
  padding:1px 5px;border-radius:4px}
.chat-b a{color:var(--accent)}
/* Which tools ran, above the answer: the reader can see what it was based on. */
.chat-steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chat-step{font-size:10.5px;font-weight:700;font-family:var(--font-mono);color:var(--muted);
  background:var(--surface3);border-radius:999px;padding:2px 9px}
.chat-dots{display:inline-flex;gap:4px;align-items:center;height:18px}
.chat-dots i{width:6px;height:6px;border-radius:50%;background:var(--accent);
  animation:chatBlink 1.1s infinite ease-in-out}
.chat-dots i:nth-child(2){animation-delay:.16s}
.chat-dots i:nth-child(3){animation-delay:.32s}
@keyframes chatBlink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.chat-chart{margin:12px 0 0;padding-top:10px;border-top:1px solid var(--line)}
.chat-chart figcaption{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:4px}
.chat-empty{padding:14px 2px}
.chat-hello{font-size:13.5px;color:var(--ink2);margin:0 0 12px}
.chat-sugs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:9px}
.chat-sug{text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;font:inherit;font-size:12.5px;line-height:1.45;color:var(--ink2);cursor:pointer}
.chat-sug:hover{border-color:var(--accent);color:var(--ink)}
.chat-compose{display:flex;gap:9px;align-items:flex-end;margin-top:12px}
.chat-compose textarea{flex:1;resize:vertical;min-height:44px;background:var(--surface);
  border:1px solid var(--line2);border-radius:10px;color:var(--ink);padding:10px 12px;
  font:inherit;font-size:13.5px;line-height:1.45}
.chat-compose textarea:focus{outline:none;border-color:var(--accent)}
.chat-compose .btn{height:44px;padding:0 18px}
.chat-foot{margin:9px 0 0}
.chat-setup .bd{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.chat-setup-t{margin:0;font-size:13.5px;font-weight:700;color:var(--ink)}

/* ---- le panneau flottant ----
   Comme le volet Copilot : ouvert par-dessus la page, a cote du bouton, sans la
   quitter. Au-dessus des barres collantes (z 40), sous les reglages (z 200). */
.assist-fab{position:fixed;right:22px;bottom:22px;z-index:150;width:58px;height:58px;
  border-radius:50%;border:0;padding:0;cursor:pointer;background:#451DC7;overflow:hidden;
  box-shadow:0 6px 18px -4px rgba(37,15,107,.55),0 0 0 3px var(--surface);
  transition:transform .16s ease,box-shadow .16s ease}
.assist-fab img{width:100%;height:100%;display:block}
.assist-fab:hover{transform:translateY(-2px) scale(1.04);
  box-shadow:0 10px 24px -6px rgba(37,15,107,.6),0 0 0 3px var(--surface)}
.assist-fab:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.assist-fab[aria-expanded="true"]{box-shadow:0 0 0 3px var(--accent),0 6px 18px -4px rgba(37,15,107,.55)}
/* une reponse attend : pastille verte, a la charte */
.assist-fab.has-new::after{content:"";position:absolute;top:5px;right:5px;width:12px;height:12px;
  border-radius:50%;background:var(--green);box-shadow:0 0 0 2px #451DC7}
.assist-panel{position:fixed;right:22px;bottom:94px;z-index:150;width:min(430px,calc(100vw - 44px));
  height:min(660px,calc(100vh - 128px));display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--line2);border-radius:16px;overflow:hidden;
  box-shadow:0 24px 60px -18px rgba(12,8,32,.45);transform-origin:100% 100%;
  animation:assistIn .18s ease-out}
.assist-panel[hidden]{display:none}
.assist-panel.wide{width:min(900px,calc(100vw - 44px));height:calc(100vh - 128px)}
@keyframes assistIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.assist-h{display:flex;align-items:center;gap:10px;padding:11px 12px 11px 14px;
  border-bottom:1px solid var(--line);background:var(--surface)}
.assist-av{width:34px;height:34px;border-radius:50%;flex:none}
.assist-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.assist-t b{font-size:14px;font-weight:800}
.assist-t span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.assist-hb{width:32px;height:32px;display:grid;place-items:center;flex:none;border:0;border-radius:8px;
  background:transparent;color:var(--ink2);cursor:pointer}
.assist-hb:hover{background:var(--surface2);color:var(--ink)}
.assist-hb svg{width:16px;height:16px}
.assist-body{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 14px 10px}
.assist-body .chat-log{flex:1;min-height:0;max-height:none;padding:12px 2px 4px}
.assist-body .chat-sugs{grid-template-columns:1fr}
.assist-panel.wide .chat-sugs{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.assist-body .chat-compose{margin-top:8px}
.assist-body .chat-compose textarea{resize:none}
.assist-setup{margin:12px 0 0;padding:12px 13px;background:var(--surface2);border:1px solid var(--line);
  border-radius:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.assist-setup .q-note{margin:0}
/* La note passe sous les commandes : a cote d'elles, dans 430 px, elle
   s'ecrasait sur cinq lignes. */
.assist-foot{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.assist-foot .q-note{order:2;margin:0;font-size:11px;line-height:1.4}
.assist-tools{order:1;display:flex;gap:6px;justify-content:flex-end}
.assist-tools .btn{padding:4px 10px;font-size:12px}
@media (max-width:640px){
  .assist-panel,.assist-panel.wide{right:0;bottom:0;width:100vw;height:100dvh;border-radius:0;border:0}
  body.assist-on .assist-fab{display:none}
  #assistGrow{display:none}
}
@media (prefers-reduced-motion:reduce){.assist-panel{animation:none}.assist-fab{transition:none}}

/* ---- settings ---- */
.chat-modal{position:fixed;inset:0;z-index:200;background:rgba(12,8,32,.55);
  display:flex;align-items:center;justify-content:center;padding:20px}
.chat-modal[hidden]{display:none}
.chat-modal-b{background:var(--surface);border:1px solid var(--line2);border-radius:14px;
  padding:20px 22px;width:min(460px,100%);max-height:90vh;overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.chat-modal-b h2{margin:0 0 6px;font-size:16px;color:var(--accent)}
.chat-f{display:block;margin-top:12px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.chat-f span{display:block;margin-bottom:4px}
.chat-f input,.chat-f select{width:100%;box-sizing:border-box;background:var(--surface2);
  border:1px solid var(--line2);border-radius:8px;color:var(--ink);padding:8px 10px;
  font:inherit;font-size:13px}
.chat-modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.chat-ok{color:var(--good,#0d9c55);font-weight:600}
.chat-bad{color:var(--bad);font-weight:600}

.kpi-cap-btns{display:flex;gap:8px;flex:none}

/* ---- dropdowns that always drop down ----
   A native <select> opens its menu upward whenever the control sits near the
   top of the viewport, covering the filter row that was just used. These are a
   button plus a panel anchored under it, so the list only ever opens down. */
.dd{position:relative;display:inline-block}
.dd-btn{display:inline-flex;align-items:center;gap:7px;max-width:290px;
  background:var(--surface);border:1px solid var(--line2);color:var(--ink);
  border-radius:8px;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.dd-btn>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-btn:hover{border-color:var(--accent)}
.dd-car{font-style:normal;font-size:10px;color:var(--muted);flex:none}
.dd-add .dd-btn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dd-add .dd-car{color:var(--accent-ink)}
.dd-pop{position:absolute;top:calc(100% + 5px);left:0;z-index:70;
  min-width:100%;max-width:min(380px,86vw);max-height:340px;overflow:auto;
  background:var(--surface);border:1px solid var(--line2);border-radius:10px;
  box-shadow:0 10px 28px rgba(0,0,0,.18);padding:6px}
.dd-pop[hidden]{display:none}
.dd-q{width:100%;box-sizing:border-box;margin-bottom:6px;background:var(--surface2);
  border:1px solid var(--line2);color:var(--ink);border-radius:7px;padding:6px 9px;font-size:12.5px}
.dd-g{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  color:var(--muted);padding:8px 8px 3px}
.dd-o{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink2);
  border-radius:7px;padding:6px 9px;font-size:12.5px;cursor:pointer;font-family:inherit;line-height:1.3}
.dd-o:hover{background:var(--surface3);color:var(--ink)}
.dd-o.on{color:var(--accent);font-weight:700}
.dd-o[hidden],.dd-g[hidden]{display:none}
.btn.lnk{border:0;background:none;padding:4px 2px;color:var(--accent);text-decoration:underline}

@media(max-width:520px){
  .filters .dd{flex:1 1 auto}
  .kpi-mx-r{grid-template-columns:104px repeat(var(--cols),minmax(70px,1fr))}
  .kpi-mx-lbl{font-size:11px}
  .filters .dd-btn{width:100%;max-width:none}
  .kpi-sug{grid-template-columns:1fr}
}
.docs{display:grid;grid-template-columns:1fr;gap:9px}
.docs .doc{padding:10px 12px}
.doc{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border:1px solid var(--line2);
  border-radius:10px;background:var(--surface2);text-decoration:none;transition:border-color .12s,transform .12s}
.doc:hover{text-decoration:none;border-color:var(--accent);transform:translateY(-1px)}
.doc-t{font-weight:700;font-size:13.5px;color:var(--accent)}
.doc-d{font-size:12px;color:var(--muted);line-height:1.35}
.doc-n{font-size:11.5px;font-family:var(--font-mono);color:var(--ink2);margin-top:2px}
.doc.dead{opacity:.5}
.doc.approx{border-style:dashed}
.doc-a{font-size:11px;color:var(--muted)}
.doc-root{display:inline-block;margin-top:10px;font-size:12.5px;font-weight:700}
.wb-block{margin-top:18px;border:1px solid var(--line2);border-radius:11px;background:var(--surface2);padding:12px 15px}
.wb-head{font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--accent);margin-bottom:9px}
.wb-block .sec{margin-bottom:11px}
.wb-block .sec:last-of-type{margin-bottom:6px}
.q-meta{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:7px 0 9px;font-size:12.5px;color:var(--muted)}
.q-meta .k{font-weight:600;color:var(--ink2)}
.q-meta .num{font-family:var(--font-mono)}
.q-open{display:inline-flex;align-items:center;gap:5px;background:var(--accent);color:#fff;border-radius:7px;padding:4px 11px;font-weight:700;font-size:12.5px;text-decoration:none;white-space:nowrap}
.q-open:hover{filter:brightness(1.08)}
.q-excerpt{margin:0;padding:9px 13px;border-left:3px solid var(--accent);background:var(--surface2);border-radius:0 8px 8px 0;font-size:13px;color:var(--ink2);max-width:82ch}
.q-excerpt .src-note{display:block;margin-top:5px;font-size:11.5px;color:var(--muted);font-style:italic}
/* The quoted evidence sits above the opening lines and outranks them: this is
   what the router acted on. Green, not accent, so it never reads as another
   agent-written block - it is the source speaking. */
.q-verb{margin:0 0 9px}
.q-verb-h{font-size:11.5px;font-weight:650;color:var(--ink2);margin-bottom:6px}
.q-verb-h .q-note{font-weight:400;font-style:italic}
.q-verb-q{margin:0 0 6px;padding:8px 12px;border-left:3px solid var(--ok);
  background:var(--surface2);border-radius:0 8px 8px 0;font-size:13px;
  color:var(--ink2);max-width:82ch}
.q-verb-q:last-child{margin-bottom:0}
.q-verb-t{display:block;font-size:10.5px;font-weight:650;letter-spacing:.03em;
  text-transform:uppercase;color:var(--ok);margin-bottom:3px}
.q-verb-q mark{background:var(--accent-soft);color:var(--accent2);
  padding:0 2px;border-radius:3px;font-weight:600}
.q-open-lines > summary{cursor:pointer;font-size:11.5px;color:var(--accent);
  list-style:none;margin-bottom:6px}
.q-open-lines > summary::-webkit-details-marker{display:none}
.q-open-lines > summary:hover{text-decoration:underline}
.q-cells{margin-top:10px;border:1px solid var(--accent);border-radius:9px;background:var(--accent-soft);font-size:12.5px}
.q-cells>summary{cursor:pointer;padding:8px 11px;font-weight:700;color:var(--accent);list-style:none;display:flex;align-items:center;gap:7px}
.q-cells>summary::-webkit-details-marker{display:none}
.q-cells>summary::before{content:"▸ "}
.q-cells[open]>summary::before{content:"▾ "}
.q-cells>summary .n{background:var(--accent);color:#fff;border-radius:999px;padding:1px 7px;font-size:11px}
.q-cells-body{padding:0 11px 9px}
.q-cells-h{font-weight:700;color:var(--accent);margin-bottom:6px;display:flex;align-items:center;gap:7px}
.q-cells-h span{background:var(--accent);color:#fff;border-radius:999px;padding:1px 7px;font-size:11px}
.q-points{margin:3px 0 0;padding-left:17px}
.q-points li{margin-bottom:3px}
.q-cells-row{display:grid;grid-template-columns:190px 1fr;gap:10px;padding:3px 0;align-items:start}
.q-cells-row b{color:var(--ink2);font-weight:600}
.q-cells-row span{color:var(--ink2)}
.q-cells code{font-family:var(--font-mono);font-weight:700;color:var(--accent);background:var(--surface);border-radius:4px;padding:0 4px}
.q-cells .q-note{margin-top:6px}
.q-group{margin-bottom:14px;border:1px solid var(--line);border-radius:11px;background:var(--surface2);padding:4px}
.q-group>summary{cursor:pointer;padding:9px 12px;display:flex;gap:11px;align-items:baseline;flex-wrap:wrap;list-style:none}
.q-group>summary::-webkit-details-marker{display:none}
.q-group>summary::before{content:"▸ ";color:var(--accent)}
.q-group[open]>summary::before{content:"▾ "}
.q-group .q-card{margin:0 6px 10px}
.deck-dl{display:inline-block;text-decoration:none;margin-top:9px}
.deck-dl:hover{text-decoration:none}
.back-big{font-size:14px;font-weight:700;padding:9px 18px;border-radius:9px;margin-bottom:14px;
  background:var(--surface);border:1.5px solid var(--accent);color:var(--accent);cursor:pointer}
.back-big:hover{background:var(--accent);color:#fff}
.fi{display:inline-block;width:1.35em;height:1.01em;vertical-align:-.13em;border-radius:2px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(0,0,0,.12) inset;flex:none}
.fi svg{display:block;width:100%;height:100%}
.fi-lg{width:2.4em;height:1.8em;border-radius:4px}
.flag-txt{font-family:var(--font-mono);font-size:.85em;font-weight:700;color:var(--muted)}
.ctile-flag svg{width:100%;height:100%;display:block;border-radius:9px}
.ctiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px;margin-top:14px}
.ctile{display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:13px 9px 11px;cursor:pointer;font:inherit;text-align:center;box-shadow:var(--shadow);transition:border-color .12s,transform .12s}
.ctile:hover{border-color:var(--accent);transform:translateY(-2px)}
.ctile-flag{position:relative;display:block;width:64px;height:48px;border:1px solid var(--line);
  border-radius:9px;overflow:visible;margin-bottom:7px}
.ctile-n{position:absolute;top:-7px;right:-7px;min-width:22px;padding:1px 6px;background:var(--accent);color:#fff;
  border-radius:999px;font-size:11.5px;font-weight:700;font-family:var(--font-mono)}
.ctile-n.zero{background:var(--surface3);color:var(--muted)}
.ctile-name{font-weight:700;font-size:13px;color:var(--ink);line-height:1.25}
.ctile-sub{font-size:11px;color:var(--muted);line-height:1.3}
.ctiles.quiet .ctile{opacity:.6;padding:9px 7px}
.ctiles.quiet .ctile-flag{width:42px;height:42px;font-size:23px}
.q-proc{border:1px solid var(--line);border-radius:10px;background:var(--surface2);padding:2px 4px}
.q-proc>summary{cursor:pointer;padding:9px 12px;font-weight:700;color:var(--ink2);list-style:none;display:flex;align-items:center;gap:9px}
.q-proc>summary::-webkit-details-marker{display:none}
.q-proc>summary::before{content:"\25b8 ";color:var(--accent)}
.q-proc[open]>summary::before{content:"\25be "}
.q-proc>summary .n{font-weight:600;color:var(--muted);font-size:12.5px}
.q-proc .q-card{margin:0 6px 10px}
.q-toggle input:disabled+*,.q-toggle:has(input:disabled){opacity:.5}
.q-toggle{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.q-agent{margin-top:9px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);font-size:12.5px}
.q-agent>summary{cursor:pointer;padding:7px 11px;color:var(--muted);font-weight:600;list-style:none}
.q-agent>summary::-webkit-details-marker{display:none}
.q-agent>summary::before{content:"▸ ";color:var(--accent)}
.q-agent[open]>summary::before{content:"▾ "}
.q-agent-row{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:5px 11px 5px 22px;border-top:1px solid var(--line);align-items:start}
.q-agent-row b{color:var(--muted);font-weight:600}
.q-agent-row span{color:var(--ink2);max-width:78ch;white-space:pre-line}
.q-src{font-size:12.5px;color:var(--muted);margin-top:7px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.q-actions{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap;align-items:center}
.q-note{font-size:12px;color:var(--muted)}
.rolenote{background:var(--info-bg);color:var(--info);border-radius:10px;padding:11px 14px;font-size:13px;margin-bottom:14px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:10px}
.form-grid label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.05em}
.form-grid input,.form-grid select,.form-grid textarea{background:var(--surface2);border:1px solid var(--line2);color:var(--ink);border-radius:7px;padding:7px 10px;font-size:13px;font-family:inherit}
.form-grid .full{grid-column:1/-1}

/* ================= Record editing ================= */
.editbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--line2);border-radius:10px;padding:10px 14px;margin-bottom:16px}
.elist{display:flex;flex-direction:column;gap:8px;margin-bottom:9px}
.elist:empty{margin-bottom:2px}
.edit-row{display:flex;gap:8px;align-items:flex-start}
.edit-row input,.edit-row textarea,.edit-row select{background:var(--surface2);border:1px solid var(--line2);color:var(--ink);border-radius:7px;padding:7px 10px;font-size:13px;font-family:inherit}
.edit-row textarea{resize:vertical;line-height:1.4}
.edit-row .grow{flex:1;min-width:0}
.edit-row input[type=date]{flex:none}
.btn.icon{padding:6px 10px;flex:none}
.form-grid textarea{resize:vertical}

/* ================= Charts ================= */
.chart-note{font-size:12px;color:var(--muted);margin:2px 0 10px}
.legend-row{display:flex;gap:16px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.leg-s{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2)}
.leg-s .sw{width:11px;height:11px;border-radius:3px}
.bar-lbl{font-size:11.5px;fill:var(--muted);font-family:var(--font-ui)}
.grid-ln{stroke:var(--line);stroke-width:1}
.axis-lbl{font-size:10.5px;fill:var(--muted);font-family:var(--font-mono)}

/* tooltip */
#tip{position:fixed;z-index:100;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 11px;font-size:12.5px;max-width:290px;box-shadow:var(--shadow);opacity:0;transition:opacity .08s;line-height:1.45}
#tip b{display:block;font-size:13px}
#tip .m{opacity:.75}

footer{max-width:1240px;margin:0 auto;padding:0 24px 40px;color:var(--muted);font-size:12px}
footer .line{border-top:1px solid var(--line);padding-top:14px;max-width:none}
h1.pg{font-size:21px;font-weight:750;letter-spacing:-.01em;margin:2px 0 4px;color:var(--accent)}
p.pg-sub{color:var(--muted);font-size:13.5px;margin:0 0 18px;max-width:88ch}

/* ================= Mobile =================
   Two breakpoints. 760px is the tablet/large-phone fold, where the two-column
   grids and the header row stop fitting. 520px is the phone, where anything
   with a fixed first column has to stack and the chrome has to shrink.
   Tables keep their horizontal scroll rather than being reflowed: a comparison
   table that wraps stops being comparable. */
@media(max-width:760px){
  .hd-row{padding:9px 14px;gap:10px}
  nav.tabs{padding:0 14px}
  main{padding:16px 14px 48px}
  .brand .by{display:none}
  .reg-pills{order:3;width:100%;overflow-x:auto;padding-bottom:2px}
  .hd-right{margin-left:auto;gap:8px}
  .tiles{gap:10px}
  .facts{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
  .cty-head{gap:12px}
  .filters input[type=search]{min-width:100%}
  .filters select,.filters .btn{flex:1 1 auto}
  .ctiles{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
  .ctile-flag{width:54px;height:41px}
}
@media(max-width:520px){
  .hd-row{padding:8px 12px}
  nav.tabs{padding:0 12px}
  nav.tabs a{padding:8px 10px;font-size:13px}
  main{padding:14px 12px 40px}
  .brand .logo{font-size:17px}
  .brand .proto{display:none}
  .tiles{grid-template-columns:1fr}
  .tile .v{font-size:23px}
  .card .bd{padding:11px 12px 14px}
  .card .cap{padding:11px 12px 0}
  /* Anything with a fixed label column stacks: 190px of label leaves nothing
     for the value on a 360px screen. */
  .q-cells-row,.q-agent-row{grid-template-columns:1fr;gap:2px}
  .q-agent-row{padding:6px 11px}
  .q-cells-row b,.q-agent-row b{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
  .q-card{padding:12px 13px}
  .q-meta{gap:9px;font-size:12px}
  .q-open{width:100%;justify-content:center;margin-top:2px}
  .q-actions{gap:7px}
  .q-actions .btn{flex:1 1 auto;justify-content:center}
  .form-grid{grid-template-columns:1fr}
  /* Two 170px columns still fit at 390px, but labels like REGISTRATION
     AUTHORITY wrap to three lines in them. One column reads better. */
  .facts{grid-template-columns:1fr}
  .ctiles{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
  .ctile-sub{display:none}
  .cty-head .upd{width:100%;text-align:left}
  .wb-block{padding:11px 12px}
  .lang-switch{margin-left:6px}
  .back-big{width:100%;text-align:center}
}
/* Touch targets: 44px is the accessibility floor, and a validator tapping
   Validate/Reject on a phone must not hit the wrong one. */
@media(hover:none){
  .btn,.q-open,.lang-switch button{min-height:38px}
  .ctile{min-height:96px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
